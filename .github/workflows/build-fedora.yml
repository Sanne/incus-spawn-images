name: Build Fedora Base Image

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel, lower-case letters (e.g. next); empty for the stable line. The tag is generated: fedora-<release>[-<channel>]-YYYYMMDD. Not yet: see the README on channels'
        required: false
        default: ''
  schedule:
    # Rebuild roughly every 10 days for security updates (1st, 11th, 21st at 03:17 UTC)
    - cron: '17 3 1,11,21 * *'
  push:
    branches: [main]
    paths:
      - 'fedora/**'
      - 'tests/test-container-boot.sh'
      - '.github/workflows/build-fedora.yml'
      - '.github/workflows/build-vm-scratch.yml'
  # Pull requests build only the container image and boot it: the from-scratch VM
  # image has its own pull_request run (build-vm-scratch.yml), and nothing is released.
  pull_request:
    paths:
      - 'fedora/**'
      - 'tests/test-container-boot.sh'
      - '.github/workflows/build-fedora.yml'

env:
  RELEASE: '45'

jobs:
  build:
    strategy:
      # Each architecture's boot test reports on its own.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Refuse a bad channel before the builds, not after them in the release job.
      - name: Check the channel
        if: github.event_name == 'workflow_dispatch'
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
        run: .github/scripts/release-tag.sh "$RELEASE" 00000000 "$CHANNEL" < /dev/null > /dev/null

      - name: Build container image
        run: |
          mkdir -p output
          podman run --rm --privileged \
            -v "${{ github.workspace }}:/build:ro" \
            -v "${{ github.workspace }}/output:/output" \
            -e OUTPUT_DIR=/output \
            fedora:${{ env.RELEASE }} \
            bash /build/fedora/build.sh

      - name: Boot the container image
        run: tests/test-container-boot.sh output/fedora-${{ env.RELEASE }}-${{ matrix.arch }}.tar.xz

      - name: Upload container artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: fedora-${{ env.RELEASE }}-${{ matrix.arch }}
          path: |
            output/fedora-${{ env.RELEASE }}-${{ matrix.arch }}.tar.xz
            output/fedora-${{ env.RELEASE }}-${{ matrix.arch }}.tar.xz.sha256

  # The VM image built from scratch, with its boot test as the gate: released as
  # -vm-direct.tar.xz. The stock-based -vm.tar.xz was last released for Fedora 44
  # (Sanne/incus-spawn#1862): no isx release that downloads Fedora 45 assets reads it.
  build-vm-direct:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-vm-scratch.yml

  release:
    needs: [build, build-vm-direct]
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/fedora-${{ env.RELEASE }}-x86_64/* release/
          cp artifacts/fedora-${{ env.RELEASE }}-aarch64/* release/

          # SHA256SUMS.v2 is the release's only manifest (Sanne/incus-spawn#1862):
          # isx up to v0.3.11 reads SHA256SUMS by arch alone and would take these
          # checksums for its own fedora-44 downloads; with no SHA256SUMS it keeps
          # its built-in release. Later isx reads SHA256SUMS.v2 first.
          cd release
          for f in *.sha256; do
            echo "$(cat "$f")  ${f%.sha256}" >> SHA256SUMS.v2
          done
          for arch in x86_64 aarch64; do
            src="../artifacts/fedora-${{ env.RELEASE }}-${arch}-vm-scratch/fedora-${{ env.RELEASE }}-${arch}-vm-scratch.tar.xz"
            cp "$src" "fedora-${{ env.RELEASE }}-${arch}-vm-direct.tar.xz"
            echo "$(cat "$src.sha256")  fedora-${{ env.RELEASE }}-${arch}-vm-direct.tar.xz" >> SHA256SUMS.v2
          done
          rm -f *.sha256
          cat SHA256SUMS.v2
          # Every listed checksum is that of the file published under its name.
          sha256sum --strict -c SHA256SUMS.v2
          [ "$(wc -l < SHA256SUMS.v2)" = 4 ] || { echo "SHA256SUMS.v2 must list 4 assets"; exit 1; }
          [ ! -e SHA256SUMS ] || { echo "a release must not carry SHA256SUMS"; exit 1; }

      - uses: actions/checkout@v7
        with:
          path: src
          sparse-checkout: .github/scripts

      # Never a tag that exists: a second run on the same day, or a re-run, would
      # otherwise replace the assets whose checksums incus-spawn has pinned (#24).
      # Creating the tag here fails if it exists by now, so of two runs that picked
      # the same tag only one goes on to publish. It points where the release would
      # have created it, at the default branch.
      # The tag is generated, never typed (Sanne/incus-spawn#1994):
      # fedora-<release>[-<channel>]-<YYYYMMDD>[-<n>]. isx orders tags within a line
      # only and follows the stable line, the one without a channel, by itself.
      - name: Determine version tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail
          tag="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" \
              --jq '.[].ref | sub("^refs/tags/"; "")' \
            | src/.github/scripts/release-tag.sh "$RELEASE" "$(date -u +%Y%m%d)" "$CHANNEL")"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/HEAD" --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" > /dev/null
          echo "Releasing as $tag, at $sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Belt and braces: the tag is this run's own, so there is nothing to overwrite.
          overwrite_files: false
          # A channel's release never takes the repository's "Latest" from the stable line.
          make_latest: ${{ (github.event.inputs.channel || '') == '' }}
          name: Fedora ${{ env.RELEASE }} Base Image (${{ steps.version.outputs.tag }})
          body: |
            Fedora ${{ env.RELEASE }} base image for incus-spawn.

            Pre-baked with: agentuser, base packages, systemd service masks, resolved disabled.

            **Container image** (`.tar.xz`): rootfs tarball for Incus containers.
            **VM image** (`-vm-direct.tar.xz`): disk image for Incus VMs, built from scratch around incus-spawn's own kernel, which the firmware starts directly: no boot loader, no initrd, no modules. It needs the root disk on virtio-blk and Secure Boot off, both of which isx sets from the release that reads `SHA256SUMS.v2` on.

            **Checksums:** `SHA256SUMS.v2` lists all four assets. There is no `SHA256SUMS`: isx releases that read only that file stay on their built-in Fedora 44 release.

            **Usage:** ${{ (github.event.inputs.channel || '') == '' && 'isx tracks the newest release of this stable line by itself; the automated bump in `incus-spawn` updates the built-in fallback in `minimal.yaml`.' || format('a release of the `{0}` channel, which isx never tracks and the automated bump never proposes: pin it by hand with `isx update-base {1}`.', github.event.inputs.channel, steps.version.outputs.tag) }}
          files: |
            release/fedora-${{ env.RELEASE }}-x86_64.tar.xz
            release/fedora-${{ env.RELEASE }}-aarch64.tar.xz
            release/fedora-${{ env.RELEASE }}-x86_64-vm-direct.tar.xz
            release/fedora-${{ env.RELEASE }}-aarch64-vm-direct.tar.xz
            release/SHA256SUMS.v2
